      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vierp-network

  # ─── Khởi tạo bucket MinIO (chạy 1 lần, anonymous download) ───
  minio-setup:
    image: minio/mc:latest
    container_name: vierp-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-minioadmin}' '${MINIO_ROOT_PASSWORD}'; do echo waiting-for-minio; sleep 2; done &&
      mc mb --ignore-existing local/${COVUA_S3_BUCKET:-covua-media} &&
      mc anonymous set download local/${COVUA_S3_BUCKET:-covua-media} &&
      echo MinIO-bucket-ready
      "
    restart: "no"
    networks:
      - vierp-network

  # ─── Cờ vua Dương Sinh (Next 15 + Payload CMS) ───────────────
  covua:
    image: ghcr.io/nclamvn/vierp-covua:${IMAGE_TAG:-latest}
    container_name: vierp-covua
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # DB riêng "covua" trên Postgres self-host (Payload tự quản schema qua migrate)
      DATABASE_URI: postgresql://${POSTGRES_USER:-vierp}:${POSTGRES_PASSWORD}@postgres:5432/covua
      PAYLOAD_SECRET: ${COVUA_PAYLOAD_SECRET}
      # Bootstrap schema LẦN ĐẦU trên DB rỗng: đặt COVUA_DB_PUSH=true (1 lần) trong .env,
      # khởi động covua để Payload tạo schema, rồi TRẢ VỀ false và restart.
      PAYLOAD_DB_PUSH: ${COVUA_DB_PUSH:-false}
      NEXT_PUBLIC_SERVER_URL: "https://clb.${BASE_DOMAIN}"
      # Storage qua MinIO (S3-compatible, nội bộ); public URL phục vụ qua Caddy
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${COVUA_S3_BUCKET:-covua-media}
      S3_REGION: ${COVUA_S3_REGION:-ap-southeast-1}
      S3_PUBLIC_URL: "https://minio.${BASE_DOMAIN}"
      # Cổng phụ huynh (OTP) — tách khỏi staff
      PARENT_SESSION_SECRET: ${COVUA_PARENT_SESSION_SECRET}
      OTP_PROVIDER: ${COVUA_OTP_PROVIDER:-dev}
      # Event bus (Pha 4 — đồng bộ ERP)
      NATS_URL: nats://nats:4222
      MODULE_NAME: covua
      # SSO Keycloak (Pha 3): SSO_URL nội bộ (token/userinfo), SSO_PUBLIC_URL cho
      # trình duyệt (authorize/logout) — BẮT BUỘC khi chạy sau Caddy, nếu thiếu thì
      # redirect đăng nhập sẽ trỏ vào keycloak:8080 nội bộ và hỏng.
      SSO_URL: http://keycloak:8080
      SSO_PUBLIC_URL: "https://sso.${BASE_DOMAIN}"
      SSO_REALM: ${SSO_REALM:-vierp}
      SSO_CLIENT_ID: ${COVUA_SSO_CLIENT_ID:-covua}
      SSO_CLIENT_SECRET: ${COVUA_SSO_CLIENT_SECRET}
    ports:
      - "3014:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/access"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vierp-network

# ═══════════════════════════════════════════════════════════════
# VOLUMES / PERSISTENT DATA STORAGE
# ═══════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  minio_data:
    driver: local

# ═══════════════════════════════════════════════════════════════
# NETWORKS / INTERNAL COMMUNICATION
# ═══════════════════════════════════════════════════════════════
networks:
  vierp-network:
    driver: bridge
