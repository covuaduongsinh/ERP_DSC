# ============================================================
# VietERP Platform — Docker Compose Sản Xuất / Production
# Cấu hình cho Phát Triển / For Production Deployment
# ============================================================

version: "3.9"

services:
  # ─── Cơ sở dữ liệu / Database ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vierp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vierp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vierp_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vierp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vierp-network

  # ─── Bộ nhớ đệm / Cache ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vierp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vierp-network

  # ─── Hệ thống sự kiện / Event Bus (NATS JetStream) ──────────
  nats:
    image: nats:2-alpine
    container_name: vierp-nats
    restart: unless-stopped
    ports:
      - "4222:4222" # Client
      - "8222:8222" # HTTP monitoring
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vierp-network

  # ─── Xác thực SSO / Authentication (Keycloak) ────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: vierp-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vierp_prod}
      KC_DB_USERNAME: ${POSTGRES_USER:-vierp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      # Issuer cố định = host công khai để token (cấp qua sso.) khớp khi userinfo
      # gọi qua URL nội bộ (keycloak:8080) — nếu không sẽ lỗi userinfo 401.
      KC_HOSTNAME: sso.${BASE_DOMAIN}
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    command: start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1.5G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vierp-network

  # ─── Cổng API / API Gateway (Kong) ───────────────────────────
  kong:
    image: kong:3.6-ubuntu
    container_name: vierp-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: notice
      KONG_WORKER_PROCESSES: 4
    ports:
      - "8000:8000" # Proxy
      - "8001:8001" # Admin API
    volumes:
      - ./infrastructure/kong/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vierp-network

